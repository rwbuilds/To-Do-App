name: Build Windows App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # required to create/update Releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run make

      # Collect the built .exe(s) for the release
      - name: Gather installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem -Path out/make -Recurse -Filter *.exe | ForEach-Object {
            Copy-Item $_.FullName -Destination release/
          }
          # electron-updater/update-electron-app also expects RELEASES + .nupkg for Squirrel feeds
          Get-ChildItem -Path out/make -Recurse -Include *.nupkg,RELEASES | ForEach-Object {
            Copy-Item $_.FullName -Destination release/
          }

      # Publish a version-tagged Release (so auto-update can detect new versions)
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Jot v${{ steps.ver.outputs.version }}
          files: release/*
          fail_on_unmatched_files: true
