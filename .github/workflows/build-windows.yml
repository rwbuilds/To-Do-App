name: Build Windows App

# Build the .exe whenever you push, or manually from the Actions tab
on:
  push:
    branches: [main, master]
  workflow_dispatch:   # lets you trigger a build by hand from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest   # GitHub's free Windows build machine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run make

      # Upload the installer so you can download it from the Actions run page
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickNotesWidget-Windows-Installer
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg
          if-no-files-found: error

      # Also upload the portable zipped app (no install needed)
      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: QuickNotesWidget-Windows-Portable
          path: out/make/zip/**/*.zip
          if-no-files-found: warn
