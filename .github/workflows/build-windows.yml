name: Build Windows App

# Build the .exe whenever you push, or manually from the Actions tab
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # required to create/update Releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run make

      # Collect the built .exe(s) into a folder for the release
      - name: Gather installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem -Path out/make -Recurse -Filter *.exe | ForEach-Object {
            Copy-Item $_.FullName -Destination release/
          }

      # Publish to a GitHub Release (does NOT count against Actions artifact storage)
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jot (latest build)
          files: release/*.exe
          fail_on_unmatched_files: true
