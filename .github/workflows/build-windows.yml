name: Build Windows App

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write   # required to create/update Releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # Electron 44 needs Node 22.12 or later

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      # Fail fast if this version was already released. Re-releasing an existing
      # tag would mutate that Release and can corrupt the Squirrel auto-update
      # feed (RELEASES/.nupkg). Bump the version in package.json instead.
      - name: Guard against tag collision
        shell: pwsh
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          git fetch --tags --quiet
          $exists = git tag --list $tag
          if ($exists) {
            Write-Error "Tag $tag already exists. Bump 'version' in package.json (and APP_VERSION in index.html) before pushing."
            exit 1
          }
          Write-Host "No existing release for $tag — proceeding."

      - name: Install dependencies
        run: npm ci

      - name: Check version sync (package.json vs index.html APP_VERSION)
        run: npm run version:check

      - name: Build Windows installer
        run: npm run make

      # Collect the built .exe(s) for the release
      - name: Gather installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem -Path out/make -Recurse -Filter *.exe | ForEach-Object {
            Copy-Item $_.FullName -Destination release/
          }
          # electron-updater/update-electron-app also expects RELEASES + .nupkg for Squirrel feeds
          Get-ChildItem -Path out/make -Recurse -Include *.nupkg,RELEASES | ForEach-Object {
            Copy-Item $_.FullName -Destination release/
          }

      # Publish a version-tagged Release (so auto-update can detect new versions)
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          # Tag the commit this job built. Without this, a missing tag is created
          # at the branch HEAD when the release is published, which is wrong if
          # another push landed during the build (v1.6.1 was tagged on v1.6.2's commit).
          target_commitish: ${{ github.sha }}
          name: Jot v${{ steps.ver.outputs.version }}
          files: release/*
          fail_on_unmatched_files: true
