name: Build and release (Windows + Mac)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

# The build jobs only read the repo. Only the publish job can write releases.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22   # Electron 44 needs Node 22.12 or later
          # Release workflows keep dependency caching off (setup-node's advice for workflows
          # with write access). It is already off while package.json has no packageManager
          # field; this keeps it off if one is added.
          package-manager-cache: false

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      # Fail fast if this version was already released. Re-releasing an existing
      # tag would mutate that Release and can corrupt the Squirrel auto-update
      # feed (RELEASES/.nupkg). Bump the version in package.json instead.
      - name: Guard against tag collision
        shell: pwsh
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          git fetch --tags --quiet
          $exists = git tag --list $tag
          if ($exists) {
            Write-Error "Tag $tag already exists. Bump 'version' in package.json (and APP_VERSION in index.html) before pushing."
            exit 1
          }
          Write-Host "No existing release for $tag, proceeding."

      - name: Install dependencies
        run: npm ci

      - name: Check version sync (package.json vs index.html APP_VERSION)
        run: npm run version:check

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run make

      # Collect the installer plus RELEASES and .nupkg, which the Windows auto-updater reads
      - name: Gather installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Get-ChildItem -Path out/make -Recurse -Filter *.exe | ForEach-Object {
            Copy-Item $_.FullName -Destination release/
          }
          Get-ChildItem -Path out/make -Recurse -Include *.nupkg,RELEASES | ForEach-Object {
            Copy-Item $_.FullName -Destination release/
          }

      - name: Upload Windows files
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest   # Apple Silicon runner, so this builds for arm64 Macs

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build Mac app
        run: npm run make

      # The DMG maker names the file Jot.dmg; give it the version and chip type so downloads
      # from different releases don't look identical.
      - name: Gather DMG
        run: |
          set -e
          v=$(node -p "require('./package.json').version")
          mkdir -p release
          cp out/make/Jot.dmg "release/Jot-$v-mac-arm64.dmg"
          ls -l release

      - name: Upload Mac files
        uses: actions/upload-artifact@v7
        with:
          name: mac
          path: release/*
          if-no-files-found: error

  # Publish only after both builds pass, so a release never goes out with one platform missing.
  publish:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the Release

    steps:
      - name: Download build files
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -l release

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-windows.outputs.version }}
          # Tag the commit this run built. Without this, a missing tag is created
          # at the branch HEAD when the release is published, which is wrong if
          # another push landed during the build (v1.6.1 was tagged on v1.6.2's commit).
          target_commitish: ${{ github.sha }}
          name: Jot v${{ needs.build-windows.outputs.version }}
          body: |
            Windows: download JotSetup.exe and run it. If SmartScreen warns you, click More info, then Run anyway. Jot updates itself after that.

            Mac (Apple Silicon): download the .dmg, open it and drag Jot into Applications. The first time you open Jot, macOS will block it because it isn't signed with an Apple Developer ID. Go to System Settings > Privacy & Security, scroll down and click Open Anyway. Mac updates are manual: download the new .dmg and replace the app.
          files: release/*
          fail_on_unmatched_files: true
