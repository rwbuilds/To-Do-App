    e.preventDefault();
    e.currentTarget.style.borderTop = '';
    if (!noteDragSrcId || noteDragSrcId === targetId) return;
    const srcIdx = data.notes.findIndex(n => n.id === noteDragSrcId);
    const tgtIdx = data.notes.findIndex(n => n.id === targetId);
    if (srcIdx === -1 || tgtIdx === -1) return;
    const [moved] = data.notes.splice(srcIdx, 1);
    const newTgtIdx = data.notes.findIndex(n => n.id === targetId);
    data.notes.splice(newTgtIdx, 0, moved);
    saveData();
    renderNotes();
}
function onNoteDragEnd(e) {
    e.currentTarget.style.opacity = '';
    document.querySelectorAll('.note-item').forEach(el => el.style.borderTop = '');
    noteDragSrcId = null;
}

// ===== CONTEXT MENU =====
function showContextMenu(e, id) {
    e.preventDefault();
    contextTargetId = id;
    const menu = document.getElementById('contextMenu');
    menu.style.display = 'block';
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
}

function hideContextMenu() {
    document.getElementById('contextMenu').style.display = 'none';
    contextTargetId = null;
}

function ctxSetPriority(p) {
    const todo = data.todos.find(t => t.id === contextTargetId);
    if (todo) { todo.priority = p; saveData(); renderTodos(); }
    hideContextMenu();
}

function ctxDuplicate() {
    const todo = data.todos.find(t => t.id === contextTargetId);
    if (todo) {
        const dup = { ...todo, id: Date.now().toString(36) + Math.random().toString(36).substr(2,5), completed: false, createdAt: new Date().toISOString() };
        delete dup.completedAt;
        data.todos.unshift(dup);
        saveData(); renderTodos();
    }
    hideContextMenu();
}

function ctxDelete() {
    deleteTodo(contextTargetId);
    hideContextMenu();
}

function ctxToggleWip() {
    toggleWip(contextTargetId);
    hideContextMenu();
}

function ctxCopy() {
    const todo = data.todos.find(t => t.id === contextTargetId);
    if (todo) {
        let line = todo.text;
        if (todo.tags.length) line += ' ' + todo.tags.map(t => '#' + t).join(' ');
        navigator.clipboard.writeText(line).catch(() => {});
    }
    hideContextMenu();
}

document.addEventListener('click', hideContextMenu);

// Close the group "More" menu when clicking elsewhere
document.addEventListener('click', (e) => {
    const menu = document.getElementById('groupMoreMenu');
    if (menu && menu.classList.contains('open') && !e.target.closest('.group-more-wrap')) {
        menu.classList.remove('open');
    }
});

// ===== DRAG FUNCTIONALITY =====
function makeDraggable(el, handleEl) {
    let isDragging = false, startX, startY, origX, origY;
    
    (handleEl || el).addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = el.getBoundingClientRect();
        origX = rect.left;
        origY = rect.top;
        el.style.cursor = 'grabbing';
        e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let dx = e.clientX - startX;
        let dy = e.clientY - startY;
        let newX = origX + dx;
        let newY = origY + dy;
        // Keep on screen
        newX = Math.max(0, Math.min(window.innerWidth - el.offsetWidth, newX));
        newY = Math.max(0, Math.min(window.innerHeight - el.offsetHeight, newY));
        el.style.left = newX + 'px';
        el.style.top = newY + 'px';
        el.style.right = 'auto';
    });

    document.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            el.style.cursor = '';
        }
    });
}

// Only use JS-based dragging in browser mode.
// In Electron, the OS handles window dragging via -webkit-app-region: drag.
if (!window.widgetAPI) {
    makeDraggable(document.getElementById('widget'));
    makeDraggable(document.getElementById('app'), document.getElementById('titlebar'));
} else {
    // Electron: widget drags the whole OS window, and a click (no drag) opens the app.
    const widgetEl = document.getElementById('widget');
    let downX = 0, downY = 0, grabOffX = 0, grabOffY = 0, moved = false, dragging = false;

    widgetEl.addEventListener('mousedown', (e) => {
        dragging = true;
        moved = false;
        downX = e.screenX;
        downY = e.screenY;
        // Offset of the cursor within the window (window is at 0,0 origin on screen minus this)
        grabOffX = e.clientX;
        grabOffY = e.clientY;
        e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        const dx = e.screenX - downX;
        const dy = e.screenY - downY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        if (moved) {
            // Absolute placement: keep cursor at the same spot within the widget
            window.widgetAPI.moveWindow(e.screenX, e.screenY, grabOffX, grabOffY);
        }
    });

    window.addEventListener('mouseup', () => {
        if (dragging && !moved) {
            // It was a click, not a drag → open the app
            expandApp();
        } else if (dragging && moved) {
            // Persist the final widget position once
            if (window.widgetAPI.moveWindowEnd) window.widgetAPI.moveWindowEnd();
        }
        dragging = false;
    });

    // Remove the inline onclick so it doesn't double-fire
    widgetEl.removeAttribute('onclick');
}

// ===== HELPERS =====
function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function formatDate(dateStr) {
    const d = new Date(dateStr);
    const today = new Date();
    const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
    
    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === tomorrow.toDateString()) return 'Tomorrow';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function timeAgo(dateStr) {
    const diff = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    if (days < 7) return `${days}d ago`;
    return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function getTagColor(tag) {
    const colors = ['work', 'personal', 'urgent', 'ideas', 'dco'];
    const map = { work: 'work', personal: 'personal', urgent: 'urgent', idea: 'ideas', ideas: 'ideas', dco: 'dco', oncall: 'dco' };
    return map[tag] || colors[Math.abs(hashStr(tag)) % colors.length];
}

function hashStr(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = ((hash << 5) - hash) + str.charCodeAt(i);
    return hash;
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', (e) => {
    // Escape to collapse
    if (e.key === 'Escape') {
        if (editingNoteId) closeNoteEditor();
        else if (appState === 'expanded') collapseToWidget();
    }
    // Ctrl+N for new note
    if (e.ctrlKey && e.key === 'n' && appState === 'expanded') {
        e.preventDefault();
        switchTab('notes');
        createNote();
    }
});

// ===== RENDER ALL =====
function renderAll() {
    refreshGroupSelectors();
    renderTodos();
    renderNotes();
    updateBadge();
    setFilter('all');
}

// ===== INIT =====
refreshGroupSelectors();
updateBadge();

// Safety net: persist data if the window is ever closed/reloaded
window.addEventListener('beforeunload', () => {
    try { saveData(); } catch (e) {}
});

// Auto-link URLs on paste into the note body, and keep links clickable
(function setupNotePaste() {
    const el = document.getElementById('noteBody');
    if (!el) return;
    el.addEventListener('paste', (e) => {
        const text = (e.clipboardData || window.clipboardData).getData('text');
        // If the pasted text is a single URL, insert it as a link
        if (text && /^https?:\/\/\S+$/i.test(text.trim())) {
            e.preventDefault();
            const url = text.trim();
            document.execCommand('insertHTML', false, `<a href="${url}">${url}</a>&nbsp;`);
            linkifyEditor();
            saveCurrentNote();
        }
    });
    // Turn typed URLs into links when you press space/enter after them
    el.addEventListener('keyup', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
            autoLinkLastWord();
        }
    });
})();

function autoLinkLastWord() {
    const el = document.getElementById('noteBody');
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    // Only operate on plain text nodes to avoid double-linking
    const node = sel.anchorNode;
    if (!node || node.nodeType !== 3) return;
    const textBefore = node.textContent.slice(0, sel.anchorOffset);
    const m = textBefore.match(/(https?:\/\/[^\s]+)\s?$/i);
    if (!m) return;
    // Skip if already inside a link
    if (node.parentElement && node.parentElement.closest('a')) return;
    // (Auto-linking mid-edit is complex; links are reliably created on paste
    //  and via the Link button. Left as a no-op to avoid cursor glitches.)
}

// Electron-specific setup
if (window.widgetAPI) {
    document.body.classList.add('electron');
    document.body.classList.add('widget-mode');
    // Start collapsed as a widget; the native window is already widget-sized
    window.widgetAPI.resizeWindow('widget');

    // Show + sync the "launch at startup" toggle
    const alBtn = document.getElementById('autoLaunchBtn');
    alBtn.style.display = '';
    window.widgetAPI.getAutoLaunch().then(enabled => {
        alBtn.style.opacity = enabled ? '1' : '0.4';
        alBtn.title = enabled ? 'Launch at startup: ON' : 'Launch at startup: OFF';
    });

    // Daily auto-backup — main process only writes once per day
    try {
        const payload = JSON.stringify({ ...data, _app: 'Jot', _v: 1, _auto: true });
        window.widgetAPI.autoBackup(payload);
    } catch (e) {}

    // Click-away → collapse to widget (unless a dialog is open or editing a note)
    if (window.widgetAPI.onCollapseOnBlur) {
        window.widgetAPI.onCollapseOnBlur(() => {
            if (suppressBlurCollapse) return;
            if (editingNoteId) return;
            if (appState === 'expanded') collapseToWidget();
        });
    }
}

// Set true briefly while a native dialog (file picker) is open so the
// resulting focus loss doesn't collapse the app.
let suppressBlurCollapse = false;
function guardBlur() {
    suppressBlurCollapse = true;
    setTimeout(() => { suppressBlurCollapse = false; }, 1500);
}

function toggleAutoLaunch() {
    if (!window.widgetAPI) return;
    window.widgetAPI.getAutoLaunch().then(enabled => {
        const next = !enabled;
        window.widgetAPI.setAutoLaunch(next);
        const alBtn = document.getElementById('autoLaunchBtn');
        alBtn.style.opacity = next ? '1' : '0.4';
        alBtn.title = next ? 'Launch at startup: ON' : 'Launch at startup: OFF';
    });
}
